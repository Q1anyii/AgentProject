<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能 AI 客服</title>
    <!-- 站点图标（favicon）：内联 SVG，颜色呼应主题色 --color-accent -->
    <link rel="icon" href="favicon.png">    <!-- 引入字体：Cormorant Garamond（优雅衬线标题）+ Inter（清晰正文） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS 变量系统 —— 统一管理配色、间距、圆角、阴影
           ============================================ */
        :root {
            /* 色彩系统：柔和自然、低饱和 */
            --color-bg: #F2F0EB;              /* 页面背景：石灰白，矿物感 */
            --color-surface: #FFFFFF;          /* 卡片/浮层表面 */
            --color-text-primary: #1C1C1A;     /* 主文本：深炭色 */
            --color-text-secondary: #7A7872;   /* 次要文本：暖灰 */
            --color-text-muted: #A8A59C;       /* 弱化文本 */
            --color-border: #DCD8D0;           /* 边框/分隔线 */
            --color-border-light: #E8E5DE;     /* 浅色分隔 */
            --color-accent: #5A7D6E;           /* 强调色：青苔绿，克制自然 */
            --color-accent-light: #E8EFEC;     /* 强调色淡色背景 */
            --color-accent-hover: #4D6B5E;     /* 强调色悬停 */
            --color-danger: #B05A52;           /* 危险/删除：柔和砖红 */
            --color-danger-light: #F5E8E6;     /* 危险色淡色背景 */

            /* 间距系统：基于 4px 的栅格 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;

            /* 圆角系统 */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;

            /* 阴影系统：仅用于必要浮层，柔和克制 */
            --shadow-sm: 0 1px 3px rgba(28, 28, 26, 0.06);
            --shadow-md: 0 4px 12px rgba(28, 28, 26, 0.08);

            /* 字体系统 */
            --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            /* 尺寸 */
            --sidebar-width: 280px;
            --header-height: 64px;
            --input-height: 72px;
        }

        /* ============================================
           基础重置与全局样式
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.6;
            color: var(--color-text-primary);
            background-color: var(--color-bg);
            overflow: hidden; /* 应用级滚动由内部容器管理 */
        }

        /* 可访问性：焦点状态 */
        *:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           布局骨架：侧边栏 + 主区域
           ============================================ */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ---- 侧边栏 ---- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--color-surface);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 250ms ease;
            z-index: 10;
        }

        .sidebar-header {
            padding: var(--space-5) var(--space-6);
            border-bottom: 1px solid var(--color-border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
            letter-spacing: -0.01em;
        }

        .new-chat-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            transition: background-color 200ms, color 200ms;
        }

        .new-chat-btn:hover {
            background-color: var(--color-bg);
            color: var(--color-accent);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-3);
        }

        /* 自定义滚动条 */
        .session-list::-webkit-scrollbar {
            width: 4px;
        }
        .session-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .session-list::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 2px;
        }

        .session-item {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-1);
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            transition: background-color 200ms, color 200ms;
            position: relative;
        }

        .session-item:hover {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
        }

        .session-item.active {
            background-color: var(--color-accent-light);
            color: var(--color-accent);
        }

        .session-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background-color: var(--color-accent);
            border-radius: 0 2px 2px 0;
        }

        .session-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-left: var(--space-2);
        }

        .session-delete {
            opacity: 0;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-muted);
            transition: opacity 200ms, background-color 200ms, color 200ms;
            flex-shrink: 0;
        }

        .session-item:hover .session-delete {
            opacity: 1;
        }

        .session-delete:hover {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
        }

        .sidebar-footer {
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--color-border-light);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .health-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-accent);
            transition: background-color 300ms;
        }

        .health-indicator.degraded {
            background-color: #C4A35A;
        }

        .health-indicator.offline {
            background-color: var(--color-danger);
        }

        /* ---- 主区域 ---- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0; /* 防止 flex 子项溢出 */
            background-color: var(--color-bg);
        }

        .main-header {
            height: var(--header-height);
            padding: 0 var(--space-8);
            border-bottom: 1px solid var(--color-border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--color-bg);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .menu-toggle {
            display: none; /* 桌面端隐藏 */
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
        }

        .menu-toggle:hover {
            background-color: var(--color-surface);
        }

        .current-session-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            transition: background-color 200ms, color 200ms;
        }

        .icon-btn:hover {
            background-color: var(--color-surface);
            color: var(--color-text-primary);
        }

        /* ---- 消息区域 ---- */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-8);
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }

        .messages-wrapper {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
        }

        .welcome-state {
            text-align: center;
            padding: var(--space-16) 0;
        }

        .welcome-state h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--color-text-primary);
            margin-bottom: var(--space-4);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .welcome-state p {
            font-size: 1rem;
            color: var(--color-text-secondary);
            max-width: 400px;
            margin: 0 auto;
        }

        /* ---- 消息气泡 —— 摒弃传统气泡，采用细线框设计 ---- */
        .message {
            display: flex;
            gap: var(--space-4);
            align-items: flex-start;
            animation: fadeInUp 250ms ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .message.user .message-avatar {
            background-color: var(--color-accent-light);
            color: var(--color-accent);
        }

        .message.assistant .message-avatar {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
        }

        .message-content-wrapper {
            flex: 1;
            min-width: 0;
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-bottom: var(--space-1);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .message-content {
            font-size: 0.9375rem;
            line-height: 1.7;
            color: var(--color-text-primary);
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border-light);
            background-color: var(--color-surface);
            position: relative;
        }

        .message.assistant .message-content {
            border-left: 3px solid var(--color-accent);
        }

        /* 思考指示器 —— 极简线条风格 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5);
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--color-text-muted);
            animation: thinkingPulse 1.4s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes thinkingPulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .thinking-text {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        /* ---- 输入区域 ---- */
        .input-container {
            flex-shrink: 0;
            padding: var(--space-4) var(--space-8) var(--space-6);
            background-color: var(--color-bg);
        }

        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: var(--space-4) var(--space-5);
            padding-right: 52px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background-color: var(--color-surface);
            font-family: var(--font-body);
            font-size: 0.9375rem;
            line-height: 1.5;
            color: var(--color-text-primary);
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 160px;
            transition: border-color 200ms, box-shadow 200ms;
            overflow-y: auto;
        }

        .chat-input::placeholder {
            color: var(--color-text-muted);
        }

        .chat-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(90, 125, 110, 0.1);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background-color: var(--color-accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 200ms, transform 150ms;
        }

        .send-btn:hover {
            background-color: var(--color-accent-hover);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background-color: var(--color-border);
            cursor: not-allowed;
        }

        /* 输入框下方提示 */
        .input-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: var(--space-3);
        }

        /* ============================================
           遮罩层（移动端侧边栏打开时）
           ============================================ */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(28, 28, 26, 0.3);
            z-index: 5;
            opacity: 0;
            transition: opacity 250ms ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        /* ============================================
           响应式设计：移动端优先
           ============================================ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: var(--shadow-md);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: flex;
            }

            .main-header {
                padding: 0 var(--space-4);
            }

            .messages-container {
                padding: var(--space-4);
            }

            .input-container {
                padding: var(--space-3) var(--space-4) var(--space-4);
            }

            .welcome-state h1 {
                font-size: 1.75rem;
            }

            .welcome-state {
                padding: var(--space-10) 0;
            }

            .current-session-title {
                font-size: 1rem;
                font-family: var(--font-body);
                font-weight: 500;
            }
        }

        /* ============================================
           空状态与错误状态
           ============================================ */
        .empty-state {
            text-align: center;
            padding: var(--space-10) 0;
            color: var(--color-text-muted);
        }

        .error-toast {
            position: fixed;
            bottom: var(--space-6);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-danger);
            color: white;
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            box-shadow: var(--shadow-md);
            z-index: 100;
            opacity: 0;
            transition: transform 300ms ease, opacity 300ms ease;
            pointer-events: none;
        }

        .error-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ============================================
           几何点缀元素
           ============================================ */
        .geo-accent {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 1px solid var(--color-border-light);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }

        .welcome-state .geo-accent {
            top: -40px;
            right: -60px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏：会话列表 -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="会话列表">
            <div class="sidebar-header">
                <span class="sidebar-title">智能客服</span>
                <button class="new-chat-btn" id="newChatBtn" title="新建会话" aria-label="新建会话">
                    <!-- 加号图标 -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <!-- 会话列表动态渲染 -->
            </div>
            <div class="sidebar-footer">
                <span class="health-indicator" id="healthIndicator" title="服务状态"></span>
                <span id="healthText">服务正常</span>
            </div>
        </aside>

        <!-- 移动端遮罩 -->
        <div class="overlay" id="overlay"></div>

        <!-- 主区域：聊天界面 -->
        <main class="main-area">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle" aria-label="展开菜单">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h2 class="current-session-title" id="currentSessionTitle">新会话</h2>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="clearChatBtn" title="清空当前会话" aria-label="清空当前会话">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="messages-wrapper" id="messagesWrapper">
                    <!-- 欢迎状态 -->
                    <div class="welcome-state" id="welcomeState">
                        <div class="geo-accent"></div>
                        <h1>有什么可以帮您的？</h1>
                        <p>开始一段新的对话，或从左侧选择一个历史会话继续交流。</p>
                    </div>
                    <!-- 消息列表动态渲染 -->
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        class="chat-input"
                        id="chatInput"
                        placeholder="输入您的问题..."
                        rows="1"
                        aria-label="消息输入框"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" aria-label="发送消息">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">按 Enter 发送，Shift + Enter 换行</p>
            </div>
        </main>
    </div>

    <!-- 错误提示 -->
    <div class="error-toast" id="errorToast"></div>

    <script>
        /**
         * ============================================
         * 智能 AI 客服前端应用
         * 原生 JavaScript，无外部框架依赖
         * ============================================
         */

        // ---- 状态管理 ----
        const state = {
            currentThreadId: null,
            sessions: [],
            messages: [],
            isLoading: false,
            sidebarOpen: false,
        };

        // 演示用固定用户 ID（与后端 chat 端点保持一致）
        const CURRENT_USER_ID = 'user_001';

        // ---- DOM 元素缓存 ----
        const $ = (id) => document.getElementById(id);
        const sidebar = $('sidebar');
        const overlay = $('overlay');
        const sessionList = $('sessionList');
        const messagesWrapper = $('messagesWrapper');
        const messagesContainer = $('messagesContainer');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const welcomeState = $('welcomeState');
        const currentSessionTitle = $('currentSessionTitle');
        const errorToast = $('errorToast');
        const healthIndicator = $('healthIndicator');
        const healthText = $('healthText');

        // ---- 工具函数 ----

        /**
         * 生成唯一 ID
         */
        function generateId() {
            return 'thread_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        }

        /**
         * 格式化时间
         */
        function formatTime(date = new Date()) {
            return date.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /**
         * 格式化会话标题（取首条消息前 20 字）
         */
        function formatSessionTitle(messages) {
            if (!messages || messages.length === 0) return '新会话';
            const firstUserMsg = messages.find(m => m.role === 'user');
            if (!firstUserMsg) return '新会话';
            const text = firstUserMsg.content;
            return text.length > 20 ? text.slice(0, 20) + '...' : text;
        }

        /**
         * 显示错误提示
         */
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => {
                errorToast.classList.remove('show');
            }, 3000);
        }

        /**
         * 自动调整 textarea 高度
         */
        function autoResizeTextarea() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
        }

        // ---- API 调用 ----

        const API_BASE = ''; // 使用相对路径，假设前后端同域部署

        async function apiChat(query, threadId) {
            const response = await fetch(`${API_BASE}/api/chat/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, thread_id: threadId })
            });
            if (!response.ok) throw new Error(`请求失败: ${response.status}`);
            return response.json();
        }

        async function apiGetHistory(threadId) {
            const response = await fetch(`${API_BASE}/api/chat/${threadId}/history`);
            if (!response.ok) throw new Error(`获取历史失败: ${response.status}`);
            return response.json();
        }

        async function apiGetSessions(userId) {
            const response = await fetch(`${API_BASE}/api/users/${userId}/sessions`);
            if (!response.ok) throw new Error(`获取会话列表失败: ${response.status}`);
            return response.json();
        }

        async function apiDeleteSession(threadId) {
            const response = await fetch(`${API_BASE}/api/chat/${threadId}`, {
                method: 'DELETE'
            });
            if (!response.ok) throw new Error(`删除失败: ${response.status}`);
            return response.json();
        }

        async function apiHealthCheck() {
            try {
                const response = await fetch(`${API_BASE}/health`, { method: 'GET' });
                if (!response.ok) return { status: 'degraded', db: false };
                return response.json();
            } catch {
                return { status: 'degraded', db: false };
            }
        }

        // ---- UI 渲染 ----

        /**
         * 渲染会话列表
         */
        function renderSessionList() {
            sessionList.innerHTML = '';

            if (state.sessions.length === 0) {
                sessionList.innerHTML = `
                    <div class="empty-state">
                        <p>暂无会话</p>
                    </div>
                `;
                return;
            }

            state.sessions.forEach(session => {
                const item = document.createElement('button');
                item.className = `session-item ${session.id === state.currentThreadId ? 'active' : ''}`;
                item.setAttribute('aria-label', `切换到会话: ${session.title}`);
                item.innerHTML = `
                    <span class="session-name">${escapeHtml(session.title)}</span>
                    <span class="session-delete" role="button" aria-label="删除会话">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </span>
                `;

                // 切换会话
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.session-delete')) return;
                    switchSession(session.id);
                });

                // 删除会话
                const deleteBtn = item.querySelector('.session-delete');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteSession(session.id);
                });

                sessionList.appendChild(item);
            });
        }

        /**
         * 渲染消息列表
         */
        function renderMessages() {
            if (state.messages.length === 0) {
                // 清空消息区残留 DOM，避免旧会话消息残留在页面上
                messagesWrapper.innerHTML = '';
                messagesWrapper.appendChild(welcomeState);
                welcomeState.style.display = 'block';
                return;
            }

            welcomeState.style.display = 'none';
            messagesWrapper.innerHTML = '';
            messagesWrapper.appendChild(welcomeState);

            state.messages.forEach(msg => {
                const messageEl = createMessageElement(msg);
                messagesWrapper.appendChild(messageEl);
            });

            scrollToBottom();
        }

        /**
         * 创建单个消息元素
         */
        function createMessageElement(msg) {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            div.innerHTML = `
                <div class="message-avatar" aria-hidden="true">
                    ${msg.role === 'user' ? '我' : 'AI'}
                </div>
                <div class="message-content-wrapper">
                    <div class="message-meta">
                        <span>${msg.role === 'user' ? '您' : 'AI 助手'}</span>
                        <span>·</span>
                        <span>${msg.time}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
            `;
            return div;
        }

        /**
         * 添加思考中指示器
         */
        function addThinkingIndicator() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'thinkingIndicator';
            div.innerHTML = `
                <div class="message-avatar" aria-hidden="true">AI</div>
                <div class="message-content-wrapper">
                    <div class="message-meta">
                        <span>AI 助手</span>
                        <span>·</span>
                        <span>思考中</span>
                    </div>
                    <div class="message-content">
                        <div class="thinking-indicator">
                            <div class="thinking-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="thinking-text">正在思考...</span>
                        </div>
                    </div>
                </div>
            `;
            messagesWrapper.appendChild(div);
            scrollToBottom();
        }

        /**
         * 移除思考中指示器
         */
        function removeThinkingIndicator() {
            const indicator = $('thinkingIndicator');
            if (indicator) indicator.remove();
        }

        /**
         * 滚动到底部
         */
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        /**
         * HTML 转义，防止 XSS
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---- 业务逻辑 ----

        /**
         * 从服务端加载历史会话列表（刷新页面后恢复侧边栏）
         */
        async function loadSessions() {
            try {
                const sessions = await apiGetSessions(CURRENT_USER_ID);
                state.sessions = (sessions || []).map(s => ({
                    id: s.thread_id,
                    title: s.title || '新会话',
                    messages: []
                }));
            } catch (err) {
                state.sessions = [];
                console.warn('加载会话列表失败:', err.message);
            }
            renderSessionList();
        }

        /**
         * 新建会话
         */
        function createNewSession() {
            // 回收空白会话：新建前移除所有从未发过消息的会话，避免反复点击“+”造成堆积
            state.sessions = state.sessions.filter(s => !s.isBlank);

            const threadId = generateId();
            const session = {
                id: threadId,
                title: '新会话',
                messages: [],
                isBlank: true  // 标记为空白会话（从未发过消息），后续可被回收
            };
            state.sessions.unshift(session);
            state.currentThreadId = threadId;
            state.messages = [];

            renderSessionList();
            renderMessages();
            updateHeaderTitle();
            closeSidebar();
            chatInput.focus();
        }

        /**
         * 切换会话
         */
        async function switchSession(threadId) {
            if (threadId === state.currentThreadId) return;

            state.currentThreadId = threadId;
            const session = state.sessions.find(s => s.id === threadId);

            if (session && session.messages.length > 0) {
                state.messages = [...session.messages];
                renderMessages();
            } else {
                // 从服务器加载历史
                try {
                    const history = await apiGetHistory(threadId);
                    const messages = parseHistory(history);
                    state.messages = messages;
                    if (session) session.messages = messages;
                    renderMessages();
                } catch (err) {
                    state.messages = [];
                    renderMessages();
                }
            }

            renderSessionList();
            updateHeaderTitle();
            closeSidebar();
        }

        /**
         * 解析历史记录格式（后端返回 [{role, content}] 结构）
         */
        function parseHistory(history) {
            if (!Array.isArray(history)) return [];
            return history.map(item => ({
                role: item.role === 'human' ? 'user' : 'assistant',
                content: item.content,
                time: formatTime()
            }));
        }

        /**
         * 删除会话
         */
        async function deleteSession(threadId) {
            try {
                await apiDeleteSession(threadId);
            } catch (err) {
                showError('删除会话失败: ' + err.message);
                return;
            }

            state.sessions = state.sessions.filter(s => s.id !== threadId);

            if (state.currentThreadId === threadId) {
                state.currentThreadId = null;
                state.messages = [];
                renderMessages();
                updateHeaderTitle();
            }

            renderSessionList();
        }

        /**
         * 发送消息
         */
        async function sendMessage() {
            const content = chatInput.value.trim();
            if (!content || state.isLoading) return;

            // 确保有当前会话
            if (!state.currentThreadId) {
                createNewSession();
            }

            // 添加用户消息
            const userMsg = {
                role: 'user',
                content: content,
                time: formatTime()
            };
            state.messages.push(userMsg);

            // 更新会话标题
            const session = state.sessions.find(s => s.id === state.currentThreadId);
            if (session && session.title === '新会话') {
                session.title = content.length > 20 ? content.slice(0, 20) + '...' : content;
            }
            // 一旦发送消息，该会话不再是空白会话（不可被回收）
            if (session) session.isBlank = false;
            if (session) session.messages = [...state.messages];

            // 清空输入框
            chatInput.value = '';
            chatInput.style.height = 'auto';
            renderSessionList();
            renderMessages();

            // 发送请求
            state.isLoading = true;
            sendBtn.disabled = true;
            addThinkingIndicator();

            try {
                const result = await apiChat(content, state.currentThreadId);
                removeThinkingIndicator();

                const aiMsg = {
                    role: 'assistant',
                    content: result.answer,
                    time: formatTime()
                };
                state.messages.push(aiMsg);
                if (session) session.messages = [...state.messages];

                renderMessages();
            } catch (err) {
                removeThinkingIndicator();
                showError('发送消息失败: ' + err.message);
            } finally {
                state.isLoading = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }

        /**
         * 清空当前会话
         */
        function clearCurrentChat() {
            state.messages = [];
            const session = state.sessions.find(s => s.id === state.currentThreadId);
            if (session) {
                session.messages = [];
                session.title = '新会话';
            }
            renderMessages();
            renderSessionList();
            updateHeaderTitle();
        }

        /**
         * 更新标题栏
         */
        function updateHeaderTitle() {
            const session = state.sessions.find(s => s.id === state.currentThreadId);
            currentSessionTitle.textContent = session ? session.title : '新会话';
        }

        /**
         * 侧边栏控制
         */
        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            state.sidebarOpen = true;
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            state.sidebarOpen = false;
        }

        /**
         * 健康检查
         */
        async function checkHealth() {
            const result = await apiHealthCheck();
            healthIndicator.className = 'health-indicator';

            if (result.status === 'ok' && result.db) {
                healthIndicator.classList.add('online');
                healthText.textContent = '服务正常';
            } else {
                healthIndicator.classList.add('degraded');
                healthText.textContent = '服务异常';
            }
        }

        // ---- 事件绑定 ----

        $('newChatBtn').addEventListener('click', createNewSession);
        $('menuToggle').addEventListener('click', openSidebar);
        $('clearChatBtn').addEventListener('click', clearCurrentChat);
        overlay.addEventListener('click', closeSidebar);

        sendBtn.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        chatInput.addEventListener('input', autoResizeTextarea);

        // ---- 初始化 ----

        async function init() {
            // 先从服务端恢复历史会话；无历史时再新建一个会话
            await loadSessions();
            if (state.sessions.length === 0) {
                createNewSession();
            }

            // 检查服务健康状态
            checkHealth();
            setInterval(checkHealth, 30000);
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
