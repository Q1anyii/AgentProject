<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitta AI — 智能助理</title>
    <link rel="icon" href="favicon.png">
    <!-- 字体：Space Grotesk（现代几何感标题）+ Inter（清晰正文） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
    <!-- Vue 3 + Vue Router CDN（主源 jsdelivr，备源 unpkg/bootcdn，按顺序加载） -->
    <script>
        // CDN 加载失败检测与回退：按顺序尝试多个源
        (function loadScript(srcs, callback) {
            var i = 0;
            (function tryNext() {
                if (i >= srcs.length) {
                    callback(false);
                    return;
                }
                var s = document.createElement('script');
                s.src = srcs[i++];
                s.onload = function () { callback(true); };
                s.onerror = tryNext;
                document.head.appendChild(s);
            })();
        })([
            'https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js',
            'https://cdn.bootcdn.net/ajax/libs/vue/3.5.13/vue.global.prod.min.js',
            'https://unpkg.com/vue@3/dist/vue.global.js'
        ], function (ok) {
            if (!ok) {
                window.__vueFailed = true;
                // 所有 CDN 源均失败：显示友好错误提示而非空白页
                setTimeout(showLoadError, 1000);
                return;
            }
            loadRouter();
        });

        function showLoadError() {
            var app = document.getElementById('app');
            if (app && (!window.Vue || !window.VueRouter)) {
                app.innerHTML = [
                    '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:sans-serif;background:#F7F5F0;">',
                    '<div style="text-align:center;padding:40px;max-width:440px;">',
                    '<h2 style="margin-bottom:12px;color:#1A1A19;">页面加载失败</h2>',
                    '<p style="color:#6E6C66;line-height:1.7;font-size:14px;">',
                    'Vue 框架资源加载失败，请检查网络连接后刷新重试。<br>',
                    '若网络受限，请下载 vue.global.prod.js 与 vue-router.global.prod.js 到本地，',
                    '并将 HTML 中 CDN 引用替换为本地路径。</p>',
                    '</div></div>'
                ].join('');
            }
        }

        function loadRouter() {
            (function loadScript(srcs, callback) {
                var i = 0;
                (function tryNext() {
                    if (i >= srcs.length) {
                        callback(false);
                        return;
                    }
                    var s = document.createElement('script');
                    s.src = srcs[i++];
                    s.onload = function () { callback(true); };
                    s.onerror = tryNext;
                    document.head.appendChild(s);
                })();
            })([
                'https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.global.prod.js',
                'https://cdn.bootcdn.net/ajax/libs/vue-router/4.5.0/vue-router.global.prod.min.js',
                'https://unpkg.com/vue-router@4/dist/vue-router.global.js'
            ], function (ok) {
                window.__routerReady = ok;
                window.__depsReady = true;
                if (ok) {
                    // 依赖全部就绪，触发应用初始化
                    var evt = new Event('deps-ready');
                    window.dispatchEvent(evt);
                } else {
                    // Vue Router 加载失败：显示错误提示
                    setTimeout(showLoadError, 1000);
                }
            });
        }
    </script>
    <style>
        /* ============================================================

            --shadow-xs: 0 1px 2px rgba(26, 26, 25, 0.04);
            --shadow-sm: 0 2px 6px rgba(26, 26, 25, 0.06);
            --shadow-md: 0 8px 24px rgba(26, 26, 25, 0.08);
            --shadow-lg: 0 16px 40px rgba(26, 26, 25, 0.12);

            --font-display: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            --sidebar-width: 300px;
            --header-height: 68px;
        }

            --bg-input: #252827;
            --bg-glass: rgba(37, 40, 39, 0.85);

            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);

            --text-secondary: #5A6B7C;
            --text-muted: #8A9BAC;
            --text-inverse: #F0F4F8;
            --text-inverse-muted: #A0B0C0;
            --accent: #2E6B9E;

        [data-theme="forest"] {

            --bg-surface: #FFFFFF;
            --bg-sidebar: #1F3D2B;

        [data-theme="lavender"] {

            --bg-sidebar-hover: #3D2F4D;
            --bg-input: #FFFFFF;
            --bg-glass: rgba(255, 255, 255, 0.72);
            --text-primary: #231A2B;
            --text-secondary: #635A6B;
            --text-muted: #938A9B;
            --text-inverse: #F5F0F8;

        }

        /* 主题切换过渡动画 */
        body, .sidebar, .main-header, .input-card, .message-content {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* ============================================================
           基础重置
           ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-body);
            overflow: hidden;
        }

        button, input, textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================================
           通用组件
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 200ms ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(61, 107, 91, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(61, 107, 91, 0.3);
        }

        .btn-primary:disabled {
            background-color: var(--border-strong);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--bg-body);
            color: var(--text-primary);
        }

        .btn-ghost {
            color: var(--text-secondary);
            padding: 8px 12px;
        }

        .btn-ghost:hover {
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-input);
            font-size: 0.9375rem;
            color: var(--text-primary);
            transition: border-color 200ms, box-shadow 200ms;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-error {
            font-size: 0.8125rem;
            color: var(--danger);
            margin-top: 4px;
            min-height: 1.2em;
        }

        /* 全局过渡 */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 250ms ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }

        .slide-up-enter-active,
        .slide-up-leave-active {
            transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-up-enter-from,
        .slide-up-leave-to {
            opacity: 0;
            transform: translateY(16px);
        }

        /* ============================================================
           认证页面布局
           ============================================================ */
        .auth-layout {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        .auth-brand {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            background: linear-gradient(145deg, #2D3E38 0%, #1C1E1D 100%);
            color: var(--text-inverse);
            position: relative;
            overflow: hidden;
        }

        .auth-brand::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(61, 107, 91, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            z-index: 1;
        }

        .auth-logo-mark {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            overflow: hidden;  /* 圆角裁剪内部图片，否则方形图片会盖住圆角 */
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .auth-logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .auth-quote {
            max-width: 420px;
            z-index: 1;
        }

        .auth-quote h2 {
            font-family: var(--font-display);
            font-size: 2.75rem;
            font-weight: 500;
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .auth-quote p {
            font-size: 1.0625rem;
            color: var(--text-inverse-muted);
            line-height: 1.7;
        }

        .auth-footer {
            font-size: 0.8125rem;
            color: var(--text-inverse-muted);
            z-index: 1;
        }

        .auth-form-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background-color: var(--bg-body);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 48px;
            background-color: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .auth-card h1 {
            font-family: var(--font-display);
            font-size: 1.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.9375rem;
        }

        .auth-submit {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.875rem;
        }

        .auth-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .auth-hint {
            margin-top: 24px;
            padding: 12px;
            background-color: var(--accent-light);
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            color: var(--accent-hover);
            text-align: center;
        }

        .auth-hint code {
            font-family: 'JetBrains Mono', monospace;
            background-color: rgba(61, 107, 91, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* ============================================================
           聊天应用布局
           ============================================================ */
        .chat-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            color: var(--text-inverse);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .sidebar-brand-mark {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            overflow: hidden;  /* 与登录页 auth-logo-mark 保持一致：圆角裁剪内部图片 */
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .sidebar-brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .new-chat-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-inverse-muted);
            background-color: rgba(255, 255, 255, 0.06);
            transition: all 200ms ease;
        }

        .new-chat-btn:hover {
            background-color: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-list::-webkit-scrollbar {
            width: 4px;
        }
        .session-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .session-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .session-item {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.875rem;
            color: var(--text-inverse-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 200ms ease;
            position: relative;
            overflow: hidden;
        }

        .session-item:hover {
            background-color: var(--bg-sidebar-hover);
            color: var(--text-inverse);
        }

        .session-item.active {
            background-color: rgba(61, 107, 91, 0.25);
            color: white;
        }

        .session-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 18px;
            background-color: var(--accent);
            border-radius: 0 2px 2px 0;
        }

        .session-icon {
            flex-shrink: 0;
            color: inherit;
            opacity: 0.7;
        }

        .session-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-delete {
            opacity: 0;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            transition: all 200ms ease;
            flex-shrink: 0;
        }

        .session-item:hover .session-delete {
            opacity: 1;
        }

        .session-delete:hover {
            background-color: rgba(179, 86, 79, 0.2);
            color: #F5A8A3;
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.04);
            margin-bottom: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--accent), #2D5A4C);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-inverse-muted);
        }

        .logout-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-inverse-muted);
            transition: all 200ms ease;
            flex-shrink: 0;
        }

        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .health-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-inverse-muted);
        }

        .health-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            transition: background-color 300ms;
        }

        .health-dot.degraded {
            background-color: var(--warning);
        }

        .health-dot.offline {
            background-color: var(--danger);
        }

        /* ============================================================
           主聊天区
           ============================================================ */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background-color: var(--bg-body);
            position: relative;
        }

        .main-header {
            height: var(--header-height);
            padding: 0 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-glass);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            display: none;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
        }

        .menu-toggle:hover {
            background-color: var(--bg-surface);
        }

        .current-session-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 200ms ease;
        }

        .icon-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-xs);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 3px;
        }

        .messages-wrapper {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .welcome-state {
            text-align: center;
            padding: 80px 0;
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background-color: var(--accent-light);
            color: var(--accent);
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .welcome-state h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .welcome-state p {
            font-size: 1.0625rem;
            color: var(--text-secondary);
            max-width: 440px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 0 auto;
        }

        .quick-action {
            padding: 12px 18px;
            border-radius: var(--radius-md);
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.875rem;
            transition: all 200ms ease;
            box-shadow: var(--shadow-xs);
        }

        .quick-action:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        /* ============================================================
           消息气泡
           ============================================================ */
        .message {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            animation: messageIn 350ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.8125rem;
            font-weight: 600;
        }

        .message.user .message-avatar {
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .message.assistant .message-avatar {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .message-content-wrapper {
            flex: 1;
            min-width: 0;
            max-width: calc(100% - 50px);
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-content {
            font-size: 0.9375rem;
            line-height: 1.75;
            color: var(--text-primary);
            padding: 16px 18px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            background-color: var(--bg-surface);
            box-shadow: var(--shadow-xs);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.assistant .message-content {
            border-left: 3px solid var(--accent);
        }

        .message.user .message-content {
            background-color: var(--bg-surface);
        }

        /* 思考中动画 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .thinking-dots {
            display: flex;
            gap: 5px;
        }

        .thinking-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: thinkingPulse 1.5s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkingPulse {
            0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1); }
        }

        .thinking-text {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* ============================================================
           输入区
           ============================================================ */
        .input-area {
            flex-shrink: 0;
            padding: 20px 32px 28px;
            background-color: var(--bg-body);
        }

        .input-card {
            max-width: 780px;
            margin: 0 auto;
            padding: 14px 18px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: flex-end;
            gap: 12px;
            transition: border-color 200ms, box-shadow 200ms;
        }

        .input-card:focus-within {
            border-color: var(--accent);
            box-shadow: 0 8px 28px rgba(61, 107, 91, 0.12);
        }

        .chat-input {
            flex: 1;
            min-height: 28px;
            max-height: 160px;
            padding: 10px 4px;
            border: none;
            background: transparent;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--text-primary);
            resize: none;
            outline: none;
            overflow-y: auto;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            background-color: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 200ms ease;
        }

        .send-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            background-color: var(--border-strong);
            cursor: not-allowed;
        }

        .input-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
        }

        /* ============================================================
           遮罩与移动端
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(26, 26, 25, 0.35);
            backdrop-filter: blur(2px);
            z-index: 40;
            opacity: 0;
            transition: opacity 250ms ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        @media (max-width: 900px) {
            .auth-layout {
                flex-direction: column;
            }
            .auth-brand {
                min-height: 240px;
                padding: 32px;
            }
            .auth-quote h2 {
                font-size: 2rem;
            }
            .auth-form-wrapper {
                padding: 32px 24px;
            }
            .auth-card {
                padding: 32px 24px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .menu-toggle {
                display: flex;
            }
            .main-header {
                padding: 0 16px;
            }
            .messages-container {
                padding: 16px;
            }
            .input-area {
                padding: 12px 16px 20px;
            }
            .welcome-state h1 {
                font-size: 1.75rem;
            }
            .current-session-title {
                font-size: 1rem;
                font-family: var(--font-body);
                font-weight: 500;
            }
        }

        /* ============================================================
           Toast 提示
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 100;
            opacity: 0;
            transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background-color: var(--danger);
            color: white;
        }

        .toast.success {
            background-color: var(--success);
            color: white;
        }

        .toast.info {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* ============================================================
           空状态
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 48px 0;
            color: var(--text-inverse-muted);
        }

        /* ============================================================
           用户头像下拉菜单
           ============================================================ */
        .user-menu-wrapper {
            position: relative;
        }
        .user-avatar-btn {
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            border-radius: var(--radius-md);
            padding: 8px;
            transition: background-color 0.2s;
        }
        .user-avatar-btn:hover {
            background-color: var(--bg-sidebar-hover);
        }
        .user-dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            margin-bottom: 8px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1000;
        }
        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 14px;
            transition: background-color 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .user-dropdown-item:hover {
            background-color: var(--accent-light);
            color: var(--accent);
        }
        .user-dropdown-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ============================================================
           模态弹窗（个人信息 / 系统设置）
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: var(--radius-sm);
            transition: color 0.15s, background-color 0.15s;
        }
        .modal-close:hover {
            color: var(--text-primary);
            background-color: var(--bg-body);
        }
        .modal-body {
            padding: 24px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 头像选择 */
        .avatar-selector {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--text-inverse);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-ghost {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: none;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* 主题选择器 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .theme-option {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            background: var(--bg-surface);
        }
        .theme-option:hover {
            border-color: var(--accent);
        }
        .theme-option.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .theme-preview {
            width: 100%;
            height: 32px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .theme-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* MCP 配置编辑器 */
        .mcp-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mcp-item {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            background: var(--bg-body);
        }
        .mcp-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .mcp-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .mcp-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 12px;
        }
        .mcp-remove:hover {
            background: var(--danger-light);
        }

        /* ============================================================
           文件上传按钮（输入框 + 号）
           ============================================================ */
        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .upload-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }
        .upload-btn svg {
            width: 18px;
            height: 18px;
        }
        .uploaded-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .uploaded-file-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: var(--radius-full);
            font-size: 12px;
        }
        .uploaded-file-tag .remove {
            cursor: pointer;
            opacity: 0.7;
        }
        .uploaded-file-tag .remove:hover {
            opacity: 1;
        }
        .upload-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 8px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            padding: 8px;
            z-index: 100;
            min-width: 180px;
        }
        .upload-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-primary);
            transition: background-color 0.15s;
        }
        .upload-dropdown-item:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        /* ============================================================
           暂停按钮（AI 回复生成中）
           ============================================================ */
        .stop-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--danger);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(179, 86, 79, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(179, 86, 79, 0); }
        }
        .stop-btn:hover {
            background: var(--danger-hover, #9A3A33);
            transform: scale(1.05);
        }
        .stop-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 加载圈覆盖 */
        .send-btn.loading {
            background: var(--border-strong);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        /**
         * 应用主脚本：等待 Vue/VueRouter CDN 加载完成后再执行
         */
        (function boot() {
            // 防重入：deps-ready 事件与 8s 兜底定时器可能先后触发本函数两次，
            // 二次 createApp().mount() 会在卸载旧树时触发 removeFragment 的
            // nextSibling 空指针崩溃（白屏）。已挂载过则直接返回。
            if (window.__mittaBooted) {
                return;
            }
            if (!window.Vue || !window.VueRouter) {
                // 依赖未就绪：监听加载完成事件，并设置超时兜底
                window.addEventListener('deps-ready', boot, { once: true });
                setTimeout(function () {
                    if (window.Vue && window.VueRouter) {
                        boot();
                    } else {
                        // 超时仍未就绪：显示错误提示而非空白页
                        var app = document.getElementById('app');
                        if (app) {
                            app.innerHTML = [
                                '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:sans-serif;background:#F7F5F0;">',
                                '<div style="text-align:center;padding:40px;max-width:440px;">',
                                '<h2 style="margin-bottom:12px;color:#1A1A19;">页面加载失败</h2>',
                                '<p style="color:#6E6C66;line-height:1.7;font-size:14px;">',
                                'Vue 框架资源加载失败，请检查网络连接后刷新重试。</p>',
                                '</div></div>'
                            ].join('');
                        }
                    }
                }, 8000);
                return;
            }

            window.__mittaBooted = true; // 仅允许挂载一次

            const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
        const { createRouter, createWebHistory, useRouter } = VueRouter;

        // ============================================================
        // 常量与配置
        // ============================================================
        const API_BASE = ''; // 相对路径，与后端同域
        const STORAGE_KEY = {
            USER: 'mitta_auth_user',
            SESSIONS: 'mitta_sessions',
            CURRENT_THREAD: 'mitta_current_thread',
            LAST_ACTIVE: 'mitta_last_active',
            AI_CALL_NAME: 'mitta_ai_call_name' // 注册时设置的用户名，AI 以此称呼用户
        };
        const CACHE_TTL_DAYS = 7;


        // ============================================================
        // 工具函数
        // ============================================================
        function generateId() {
            return 'thread_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }

        function formatTime(date = new Date()) {
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 兼容 content 为字符串或列表（AIMessageChunk 多模态格式）的情况
        function extractContentText(content) {
            if (typeof content === 'string') return content;
            if (Array.isArray(content)) {
                return content.map(part => {
                    if (typeof part === 'string') return part;
                    if (part && typeof part === 'object') return part.text || '';
                    return '';
                }).join('');
            }
            return '';
        }

        // ============================================================
        // 缓存管理
        // ============================================================
        const cache = {
            get(key, defaultValue = null) {
                try {
                    const raw = localStorage.getItem(key);
                    if (!raw) return defaultValue;
                    const data = JSON.parse(raw);
                    if (data && data.__expires && Date.now() > data.__expires) {
                        localStorage.removeItem(key);
                        return defaultValue;
                    }
                    return data.value;
                } catch {
                    return defaultValue;
                }
            },
            set(key, value, ttlDays = CACHE_TTL_DAYS) {
                try {
                    localStorage.setItem(key, JSON.stringify({
                        value,
                        __expires: Date.now() + ttlDays * 24 * 60 * 60 * 1000
                    }));
                } catch (e) {
                    console.warn('localStorage 写入失败:', e);
                }
            },
            remove(key) {
                localStorage.removeItem(key);
            },
            messagesKey(threadId) {
                return `mitta_messages_${threadId}`;
            },
            getMessages(threadId) {
                return this.get(this.messagesKey(threadId), []);
            },
            setMessages(threadId, messages) {
                this.set(this.messagesKey(threadId), messages);
            },
            removeMessages(threadId) {
                this.remove(this.messagesKey(threadId));
            }
        };

        function updateLastActive() {
            cache.set(STORAGE_KEY.LAST_ACTIVE, Date.now(), CACHE_TTL_DAYS);
        }

        // 会话缓存 key 按用户隔离：不同账号各看各的会话列表/当前线程，
        // 否则切换账号后侧边栏会残留上一个账号的会话（点击后触发 403，造成"会话共享"假象）
        function sessionCacheKey(key) {
            const u = cache.get(STORAGE_KEY.USER, null);
            return u && u.userId ? `${key}_${u.userId}` : key;
        }

        // ============================================================
        // API 调用
        // ============================================================
        // 构造带 JWT 的请求头（登录时 token 存于 STORAGE_KEY.USER.token）
        function authHeaders(extra = {}) {
            const user = cache.get(STORAGE_KEY.USER, null);
            if (user && user.token) {
                return { Authorization: `Bearer ${user.token}`, ...extra };
            }
            return extra;
        }

        // 隐式续签：access token 过期时后端自动用 refresh（仅存 Redis）换新 token，
        // 通过响应头 X-New-Access-Token 回传，这里同步本地登录态，前端全程无感知
        function syncTokenFromHeaders(headers) {
            const newToken = headers.get('x-new-access-token');
            if (!newToken) return;
            const user = cache.get(STORAGE_KEY.USER, null);
            if (user) {
                user.token = newToken;
                cache.set(STORAGE_KEY.USER, user);
            }
        }

        // 统一处理 401：token 缺失/过期，清除登录态并回到登录页
        function handleAuthError(response) {
            if (response.status === 401) {
                cache.remove(STORAGE_KEY.USER);
                if (window.location.pathname !== '/api/login') {
                    window.location.href = '/api/login';
                }
                throw new Error('登录已过期，请重新登录');
            }
        }

        async function apiChat(query, threadId, onStream, signal) {
            const response = await fetch(`${API_BASE}/api/chat/`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ query, thread_id: threadId }),
                signal: signal,
            });
            syncTokenFromHeaders(response.headers);
            handleAuthError(response);
            if (response.status === 403) {
                // 会话归属校验：会话属于其他账号
                const data = await response.json().catch(() => ({}));
                const err = new Error(data.detail || '无权使用该会话（会话可能属于其他账号）');
                err.status = 403;
                throw err;
            }
            if (!response.ok) throw new Error(`请求失败: ${response.status}`);

            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('text/event-stream')) {
                const data = await response.json();
                return data.answer || '';
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let answer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const events = buffer.split('\n\n');
                buffer = events.pop();
                for (const event of events) {
                    const line = event.trim();
                    if (!line.startsWith('data:')) continue;
                    const payload = line.slice(5).trim();
                    if (!payload || payload === '[DONE]') continue;
                    let chunk;
                    try {
                        chunk = JSON.parse(payload);
                    } catch {
                        continue; // 跳过损坏的 SSE 数据，不中断整个流
                    }
                    const text = extractContentText(chunk.content);
                    if (text) {
                        answer += text;
                        if (onStream) onStream(answer);
                    }
                }
            }
            return answer;
        }

        async function apiGetHistory(threadId) {
            const response = await fetch(`${API_BASE}/api/chat/${threadId}/history`, {
                headers: authHeaders()
            });
            syncTokenFromHeaders(response.headers);
            handleAuthError(response);
            if (response.status === 403) {
                // 会话归属校验：会话属于其他账号
                const data = await response.json().catch(() => ({}));
                const err = new Error(data.detail || '无权访问该会话（会话可能属于其他账号）');
                err.status = 403;
                throw err;
            }
            if (!response.ok) throw new Error(`获取历史失败: ${response.status}`);
            return response.json();
        }

        async function apiDeleteSession(threadId) {
            const response = await fetch(`${API_BASE}/api/chat/${threadId}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            syncTokenFromHeaders(response.headers);
            handleAuthError(response);
            if (response.status === 403) {
                // 会话归属校验：会话属于其他账号
                const data = await response.json().catch(() => ({}));
                const err = new Error(data.detail || '无权删除该会话（会话可能属于其他账号）');
                err.status = 403;
                throw err;
            }
            if (!response.ok) throw new Error(`删除失败: ${response.status}`);
            return response.json();
        }

        async function apiHealthCheck() {
            try {
                const response = await fetch(`${API_BASE}/health`, { method: 'GET' });
                if (!response.ok) return { status: 'degraded', db: false };
                return response.json();
            } catch {
                return { status: 'degraded', db: false };
            }
        }

        // 统一解析后端 JSON 响应：兼容 401/400 错误体与 422 校验错误的 detail 数组
        async function parseApiResponse(res) {
            let data = {};
            try {
                data = await res.json();
            } catch {
                // 非 JSON 响应（如 500 空页），走下方统一错误文案
            }
            if (data.ok) return { ok: true, data };
            let message = data.message;
            if (!message && Array.isArray(data.detail)) {
                message = data.detail.map(d => d.msg || '').filter(Boolean).join('；');
            }
            return { ok: false, message: message || `请求失败(${res.status})` };
        }

                    </div>
                </div>
            `,
            data() {
                return {
                    form: { userId: '', password: '' },
                    errors: { userId: '', password: '' },
                    isSubmitting: false
                };
            },
            methods: {
                validate() {
                    let valid = true;
                    this.errors = { userId: '', password: '' };
                    if (!this.form.userId.trim()) {

                        valid = false;
                    }
                    if (!this.form.password) {

                    }
                    return valid;

                async handleLogin() {
                    if (!this.validate()) return;
                    this.isSubmitting = true;
                    try {
                        // 后端认证：MySQL 用户表校验，成功返回 { ok, token, user_info }
                        const res = await fetch(`${API_BASE}/api/login`, {
                            method: 'POST',

                        });
                        const { ok, data, message } = await parseApiResponse(res);
                        // 后端契约：ok=true 且 user_info 非空才算登录成功（用户不存在时返回 401）
                        if (ok && data.user_info) {
                            // 只存展示所需字段并剔除密码等敏感信息，避免整行落 localStorage
                            const u = data.user_info;
                            cache.set(STORAGE_KEY.USER, {
                                userId: u.userId ?? u.user_id,
                                name: u.name ?? u.username ?? u.userName,
                                role: u.role || '学员',

                            });

                            this.$router.push('/chat');

        };

                                        rows="10"
                                        spellcheck="false"
                                        style="width: 100%; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); resize: vertical; line-height: 1.5;"
                                    ></textarea>

                                        <button type="button" class="btn-ghost" @click="formatMcpJson" style="flex: 1;">格式化 JSON</button>
