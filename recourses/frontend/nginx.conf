# ============================================================
# Nginx 配置文件 —— 智能 AI 客服前后端联调
#
# 功能说明：
#   - 监听 80 端口，对外提供统一入口
#   - 静态文件（前端页面）由 Nginx 直接托管
#   - /api/* 与 /health 反向代理到 FastAPI 后端 (localhost:8000)
#   - 支持跨域、Gzip、WebSocket（预留）
#
# 使用方式：
#   1. 备份原配置：copy conf\nginx.conf conf\nginx.conf.bak
#   2. 用本文件替换你的nginx目录下的 conf\nginx.conf
#   3. 调整 root 路径为你的实际前端目录 或 配置 line 77 # root   html;
#   4. 启动 Nginx：start nginx  或  nginx -s reload
# ============================================================

worker_processes  1;

error_log  logs/error.log;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式 ----
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    # ---- 基础优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ---- Gzip 压缩 ----
    gzip  on;
    gzip_vary on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_comp_level  5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # ---- 上游后端服务 ----
    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ---- 主服务器块 ----
    server {
        listen       80;
        server_name  localhost;

        # ==========================================
        # 前端静态文件服务
        # ==========================================
        # 【重要】请将 root 指向你的前端文件实际存放目录
        # 方案 A：直接指向项目目录（推荐开发环境）
        root   E:/工作文件/AgentProject/recourses/frontend;

        # 方案 B：复制到 Nginx 默认 html 目录（推荐生产环境）
        # root   html;

        index  index.html;
        charset utf-8;

        # ---- 静态资源缓存（可选）----
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ==========================================
        # API 代理：/api/* -> FastAPI
        # ==========================================
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # 连接与超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # 请求头转发
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（预留，LangGraph 未来可能用到）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 跨域头（CORS）—— 开发环境需要
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # 处理预检请求
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ==========================================
        # 健康检查代理：/health -> FastAPI
        # ==========================================
        location /health {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # 默认入口：所有非 API 请求指向前端
        # ==========================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- 错误页面 ----
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
